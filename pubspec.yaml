name: stream_chat_flutter_ai_workspace
publish_to: none
repository: https://github.com/GetStream/stream-chat-flutter-ai

environment:
  sdk: ^3.11.0

# Pub workspace members. Pub requires explicit paths here — globs are not
# supported, so every package has to be listed.
workspace:
  - packages/stream_chat_flutter_ai
  - packages/stream_chat_flutter_ai/example
  - packages/stream_chat_flutter_ai_ondevice

dev_dependencies:
  melos: ^8.2.2

melos:
  categories:
    packages:
      - packages/*
    examples:
      - packages/*/example

  command:
    bootstrap:
      # Dart and Flutter environment used in the project.
      environment:
        sdk: ^3.11.0
        # We are not using caret '^' syntax here because flutter don't follow semantic versioning.
        flutter: ">=3.41.0"

      # List of all the dependencies used in the project.
      dependencies:
        # A sign-in's expiry reads `clock.now()`, so tests can fake the time.
        clock: ^1.1.2
        # Deep and list equality for the package's public value types.
        # Already resolved transitively via the Flutter SDK; declared because
        # the package imports it directly.
        collection: ^1.19.0
        cross_file: ^0.3.5
        fl_chart: ^1.2.0
        flutter_markdown_plus: ^1.0.7
        # Example app only — the package itself ships no math engine.
        flutter_math_fork: ^0.7.4
        image_picker: ^1.2.2
        markdown: ^7.3.1
        # Imported by the on-device model's generated platform channel.
        meta: ^1.15.0
        objective_c: ^9.3.0
        path_provider: ^2.1.5
        photo_manager: ^3.9.0
        # The on-device model's platform interface.
        plugin_platform_interface: ^2.1.0
        # Used only by the example, which supplies the grammars that
        # `CodeBlockView.highlighter` needs. See
        # `example/lib/code_highlighter.dart`.
        re_highlight: ^0.0.3
        share_plus: ^13.3.1
        speech_to_text: ^7.0.0
        # The core package, as the ondevice plugin and the example depend on it.
        # Lockstep: release-pr sets it to the version being released.
        stream_chat_flutter_ai: ^0.1.0
        uuid: ^4.5.1
        web: ^1.1.0

      # List of all the dev_dependencies used in the project.
      dev_dependencies:
        alchemist: ^0.14.0
        mocktail: ^1.0.5
        # Direct because the install id tests substitute a fake
        # `PathProviderPlatform`.
        path_provider_platform_interface: ^2.1.0
        # Generates the on-device model's platform channel from
        # `packages/stream_chat_flutter_ai_ondevice/pigeons/messages.dart`;
        # see the `generate:pigeon` script.
        pigeon: ^29.0.11
        plugin_platform_interface: ^2.1.0
        # Direct because the reply actions tests substitute their own
        # `SharePlatform`; it arrives transitively via `share_plus`.
        share_plus_platform_interface: ^7.2.0
        # Direct because the speech tests substitute their own
        # `SpeechToTextPlatform`; it arrives transitively via `speech_to_text`,
        # but importing it without declaring it fails `melos run lint:pub`.
        speech_to_text_platform_interface: ^2.4.0

  scripts:
    lint:all:
      run: melos run analyze && melos run format
      description: Run all static analysis checks

    analyze:
      # `dart analyze` resolves the whole pub workspace in a single pass, so
      # there is no need to exec it per package.
      run: dart analyze --fatal-infos .
      description: |
        Run `dart analyze` across the workspace.
         - Note: you can also rely on your IDEs Dart Analysis / Issues window.

    format:
      run: dart format --set-exit-if-changed .
      description: Run `dart format --set-exit-if-changed .` across the workspace.

    lint:pub:
      exec:
        command: flutter pub publish -n
        concurrency: 1
        orderDependents: true
      description: Dry run `pub publish` in all publishable packages.
      packageFilters:
        published: false
        private: false

    release:pub:
      exec:
        # The packages are released in lockstep and a dependent requires its
        # sibling's new version, so `orderDependents` publishes
        # stream_chat_flutter_ai first. pub.dev can take a moment to serve a
        # version it just accepted, so a failed upload is retried once after a
        # minute.
        command: >-
          flutter pub publish -f ||
          { echo "Retrying $MELOS_PACKAGE_NAME in 60s"; sleep 60; flutter pub publish -f; }
        concurrency: 1
        orderDependents: true
        failFast: true
      description: |
        Publish all publishable packages to pub.dev.
         - Note: run by `release_publish.yml` on a release tag. Never run it locally.
      packageFilters:
        published: false
        private: false

    generate:pigeon:
      run: |
        melos exec -c 1 --file-exists="pigeons/messages.dart" -- "
          dart run pigeon --input pigeons/messages.dart --swift_out=ios/\$MELOS_PACKAGE_NAME/Sources/\$MELOS_PACKAGE_NAME/Messages.g.swift &&
          dart run pigeon --input pigeons/messages.dart --swift_out=macos/\$MELOS_PACKAGE_NAME/Sources/\$MELOS_PACKAGE_NAME/Messages.g.swift &&
          dart format lib/src/messages.g.dart
        "
      description: |
        Generate Pigeon platform-channel bindings for packages with a pigeons/messages.dart
        schema. Swift output is generated once per Darwin platform (iOS, macOS) since SwiftPM
        forbids a target's source path from escaping its own package root, so the two
        platforms can't share one generated file in place. Same script as stream-core-flutter.

    test:all:
      run: melos run test:flutter --no-select
      description: Run all tests in this project.

    test:flutter:
      exec:
        command: flutter test --coverage
        concurrency: 4
        failFast: true
      description: Run Flutter tests for a specific package in this project.
      packageFilters:
        flutter: true
        dirExists: test

    update:goldens:
      exec:
        command: flutter test --tags golden --update-goldens
        concurrency: 1
      description: |
        Update golden files for all packages in this project.
        Locally this regenerates the (untracked) `goldens/macos/` variants. The
        committed `goldens/ci/` variants use obscured text for cross-host
        stability and are regenerated by the `update_goldens` workflow on Linux.
      packageFilters:
        dependsOn: alchemist

    clean:flutter:
      exec:
        command: flutter clean
        concurrency: 4
        failFast: true
      description: Run Flutter clean for a specific package in this project.
      packageFilters:
        flutter: true

    postclean:
      run: melos run clean:flutter --no-select
      description: Runs "flutter clean" in all Flutter packages

    coverage:ignore-file:
      exec:
        command: "$MELOS_ROOT_PATH/.github/workflows/scripts/remove-from-coverage.sh"
        concurrency: 5
        failFast: true
      description: Removes all the ignored files from the coverage report.
      packageFilters:
        dirExists: coverage
