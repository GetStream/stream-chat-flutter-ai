name: stream_chat_flutter_ai
homepage: https://github.com/GetStream/stream-chat-flutter-ai
description: Stream Chat AI Flutter components. Build AI-powered chat experiences with Stream.
version: 0.0.1
repository: https://github.com/GetStream/stream-chat-flutter-ai
issue_tracker: https://github.com/GetStream/stream-chat-flutter-ai/issues

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the root pubspec.yaml, under `melos.command.bootstrap`.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the root pubspec.yaml for future updates.

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

# This package is a member of the pub workspace defined in the root pubspec.yaml.
resolution: workspace

dependencies:
  # Depended on directly, not just via image_picker: `XFile` appears in this
  # package's own public API (`ChatComposerSendCallback`, and
  # `ChatComposerController.attachments`) and is re-exported from the barrel file.
  cross_file: ^0.3.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  image_picker: ^1.2.2
  # Depended on directly, not just via flutter_markdown_plus: the `pre` element
  # builder and the LaTeX syntaxes in `src/markdown/` work against `md.Element`,
  # `md.BlockSyntax` and `md.InlineSyntax`.
  markdown: ^7.3.1
  photo_manager: ^3.9.0
  speech_to_text: ^7.0.0

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  speech_to_text_platform_interface: ^2.4.0

# This package supports all platforms listed below.
flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
