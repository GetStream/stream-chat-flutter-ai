name: stream_chat_flutter_ai_example
description: "Showcase app for the stream_chat_flutter_ai components."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

# This app is a member of the pub workspace defined in the root pubspec.yaml.
resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  # The package ships LaTeX *parsing* but no math engine, so that hosts who
  # don't render math don't pay for one. Supplying it here is what makes
  # `StreamingMessageView.mathBuilder` able to typeset.
  flutter_math_fork: ^0.7.4
  # Likewise: the package recognises code fences but ships no grammars, because
  # they are several times its own size. Supplying them here is what makes
  # `StreamingMessageView.codeHighlighter` able to colorize. See
  # `lib/code_highlighter.dart`.
  re_highlight: ^0.0.3
  # Resolves to the local `packages/stream_chat_flutter_ai` member of this
  # workspace, so it needs no update when the package version is bumped.
  stream_chat_flutter_ai: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
