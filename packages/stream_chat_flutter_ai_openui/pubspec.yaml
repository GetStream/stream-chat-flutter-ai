name: stream_chat_flutter_ai_openui
version: 0.1.0
# Published from its first release on: the release PR drops this line.
publish_to: none
homepage: https://github.com/GetStream/stream-chat-flutter-ai
description: OpenUI for Stream Chat AI Flutter components. Shows the interactive UI an agent writes in OpenUI Lang in its replies.
repository: https://github.com/GetStream/stream-chat-flutter-ai
issue_tracker: https://github.com/GetStream/stream-chat-flutter-ai/issues
topics:
  - ai
  - chat
  - generative-ui
  - llm
  - openui

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the root pubspec.yaml, under `melos.command.bootstrap`.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the root pubspec.yaml for future updates.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# This package is a member of the pub workspace defined in the root pubspec.yaml.
resolution: workspace

dependencies:
  # Deep equality for the package's value types that hold JSON.
  collection: ^1.19.0
  flutter:
    sdk: flutter
  # `@internal` and `@immutable` on the package's own types.
  meta: ^1.9.1
  # Resolved to this workspace's own copy; pinned to its version once this
  # package is published.
  stream_chat_flutter_ai: ^0.1.0
  # Stream's design system: the theme tokens and the components OpenUI
  # components are drawn with, so an app's component builders apply to them
  # too.
  stream_core_flutter: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # As the packages it depends on declare it; Flutter warns when they differ.
  uses-material-design: true
