name: Package Analysis

runs:
  using: "composite"
  steps:
    - name: "Install Tools"
      shell: bash
      run: flutter pub global activate melos

    - name: "Bootstrap Workspace"
      shell: bash
      run: melos bootstrap --verbose

    # Every package directly under packages/ — the examples sit one level
    # deeper, so the glob skips them.
    #
    # Only analyze lib/; non-client code doesn't need to work on
    # all supported legacy versions.
    #
    # `--exclude-tags golden` is why this doesn't need the committed CI
    # goldens, which are pinned to the `test` job's Flutter version.
    - name: "Analyze and Test Packages"
      shell: bash
      run: |
        set -euo pipefail
        for pubspec in packages/*/pubspec.yaml; do
          package=$(dirname "$pubspec")
          echo "::group::$package"
          # A package of tests only, such as the A2UI conformance suites, has no lib/.
          if [[ -d "$package/lib" ]]; then
            (cd "$package" && dart analyze --fatal-infos lib)
          fi
          if [[ -d "$package/test" ]]; then
            (cd "$package" && flutter test --exclude-tags golden)
          fi
          echo "::endgroup::"
        done
