name: release_publish

env:
  flutter_version: "3.x"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # tag-pattern for regular releases
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # tag-pattern for pre-releases
  # A manual run is a dry run: it checks the package is publishable but skips
  # the publish and the GitHub Release, which only run on a tag push.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A re-run of the same tag must not cancel a publish part-way through.
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read  # The release is created with BOT_GITHUB_API_TOKEN
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up the Dart SDK and provision the OIDC token used for publishing.
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🔍 Verify Tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          .github/workflows/scripts/verify-release-versions.sh "$TAG"

          echo "✅ $TAG matches every publishable package."

      # Not `melos run lint:pub`: that skips versions already on pub.dev, so a
      # manual run before the version bump would validate nothing. In the pub
      # workspace a dependent resolves its sibling locally, so this passes
      # before the sibling's new version is on pub.dev.
      - name: 🌵 Dry Run
        run: melos exec --no-private --order-dependents --concurrency 1 --fail-fast -- flutter pub publish --dry-run

      # Publishes dependencies first (`orderDependents`), so pub.dev already
      # has stream_chat_flutter_ai X.Y.Z when the packages that depend on it
      # upload. A re-run of this workflow skips packages already published.
      - name: 📢 Release to pub.dev
        id: publish
        if: github.event_name == 'push'
        run: melos run release:pub

      # Shown only when the upload fails, which it does for a package's first
      # version.
      - name: 📝 First Release Notice
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::notice title=First release of a package::pub.dev can't create a package through automated publishing. A package's first version (such as stream_chat_flutter_ai_a2ui's) is uploaded by hand by a publisher member from this tag; then enable automated publishing on its pub.dev admin page and re-run this workflow."

      - name: 🏷️ Extract Version Info
        if: github.event_name == 'push'
        id: extract_version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "📦 Tag: $TAG"

          # Check if this is a pre-release (contains hyphen after version)
          is_prerelease=$([[ $TAG == *-* ]] && echo true || echo false)
          echo "ℹ️ Pre-release: $is_prerelease"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.extract_version.outputs.tag }}
          prerelease: ${{ steps.extract_version.outputs.prerelease }}
          token: ${{ secrets.BOT_GITHUB_API_TOKEN }}
