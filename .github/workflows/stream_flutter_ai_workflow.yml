name: stream_flutter_ai_workflow

env:
  flutter_version: "3.x"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Centralizes every gating decision for this workflow — path filter,
  # draft state, and push-vs-PR semantics. Downstream jobs only need a
  # single `if: needs.gate.outputs.should_run == 'true'`. A job skipped
  # this way reports `success` to branch protection (vs. `on.paths`
  # filtering, which hangs forever) — see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # `push` events to main always run the full suite.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' || (steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true) }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Detect Path Changes"
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/**'
              - 'analysis_options.yaml'
              - 'pubspec.yaml'
              - '.github/workflows/stream_flutter_ai_workflow.yml'

  analyze:
    needs: gate
    timeout-minutes: 15
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap --verbose
      - name: "Dart Analyze"
        run: |
          melos run analyze
      # SwiftPM can't share a source file between two packages, so the iOS and
      # macOS packages of a plugin each keep a copy that must stay identical.
      - name: "Apple Sources Match"
        run: |
          for package in packages/*/; do
            name=$(basename "$package")
            ios="$package/ios/$name/Sources/$name"
            macos="$package/macos/$name/Sources/$name"
            if [ -d "$ios" ] && [ -d "$macos" ]; then
              diff -r "$ios" "$macos"
            fi
          done
      - name: "Pub Check"
        if: github.base_ref == 'main'
        run: |
          melos run lint:pub

  format:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 15
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Melos Format"
        run: melos run format
      - name: "Validate Formatting"
        run: |
          ./.github/workflows/scripts/validate-formatting.sh

  test:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
          flutter pub global activate remove_from_coverage
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Flutter Test"
        run: melos run test:all
      - name: "Collect Coverage"
        run: melos run coverage:ignore-file --no-select
      - name: "Upload Coverage"
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: packages/*/coverage/lcov.info

  # Compiles the on-device plugin's Kotlin through the example app, and runs
  # its JVM unit tests. ML Kit can't run here: the model needs a device.
  android:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
      - name: "Install Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: "Install Tools"
        run: flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Build The Example"
        working-directory: packages/stream_chat_flutter_ai/example
        run: flutter build apk --debug
      - name: "Kotlin Unit Tests"
        working-directory: packages/stream_chat_flutter_ai/example/android
        run: ./gradlew :stream_chat_flutter_ai_ondevice:testDebugUnitTest

  # Compiles the on-device plugin's Swift for iOS and macOS through the example
  # app, and runs its Swift tests on the Mac. Foundation Models can't answer
  # here: it needs Apple Intelligence.
  #
  # Pinned to Xcode 26, so the FoundationModels code (not just the fallback for
  # older SDKs) is what compiles. The plugin's Xcode 27 branch
  # (`#if compiler(>=6.4)`) isn't built here: Flutter's iOS simulator build
  # doesn't work with Xcode 27 yet.
  apple:
    needs: gate
    runs-on: macos-26
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 30
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
      - name: "Select Xcode 26"
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"
      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: "Install Tools"
        run: flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Build The Example For iOS"
        working-directory: packages/stream_chat_flutter_ai/example
        run: flutter build ios --simulator --debug
      - name: "Build The Example For macOS"
        working-directory: packages/stream_chat_flutter_ai/example
        run: flutter build macos --debug
      - name: "Swift Unit Tests"
        working-directory: packages/stream_chat_flutter_ai/example/macos
        run: >-
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination 'platform=macOS'
          -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO
