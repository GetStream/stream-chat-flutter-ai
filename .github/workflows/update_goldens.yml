name: update_goldens

# Alchemist commits only the CI/obscured goldens (`goldens/ci/`), which have to
# be rendered on a Linux runner to be byte-stable against the `test` job. The
# platform/macOS variants stay untracked and are regenerated locally.
on:
  workflow_dispatch:

jobs:
  update_goldens:
    runs-on:
      group: github-public-amd64
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        continue-on-error: true
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@fba564f0d242a56a37f35a1f8843a325371d00a2
        with:
          files: "**/test/**/goldens/**/*.png"
          message: "chore: Update Goldens"
          token: ${{ steps.ci-bot-token.outputs.token }}
